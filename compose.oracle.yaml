services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env.oracle}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env.oracle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.oracle}
    volumes:
      - smartpark_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: render
      PORT: 8081
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env.oracle}
      DB_USER: ${DB_USER:?Set DB_USER in .env.oracle}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.oracle}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env.oracle}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.oracle}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.oracle}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.oracle}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8081"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env.oracle}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  smartpark_postgres:
  caddy_data:
  caddy_config:
