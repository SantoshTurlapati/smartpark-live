server:
  port: ${PORT:8081}

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mariadb://127.0.0.1:3307/smartpark}
    username: ${MYSQL_USERNAME:smartpark}
    password: ${MYSQL_PASSWORD:smartpark}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-at-least-32-characters-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
